apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frappe
  template:
    metadata:
      labels:
        app: frappe
    spec:
      containers:
      - name: frappe
        image: devopsaiagent.azurecr.io/frappe:latest
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: frappe
