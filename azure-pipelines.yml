trigger:
  branches:
    include:
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistry: 'devopsaiagent.azurecr.io'
  imageName: 'frappe'
  imageTag: '$(Build.BuildId)'

stages:
  - stage: BuildAndPush
    displayName: 'Build and Push Docker Image to ACR'
    jobs:
      - job: BuildImage
        steps:
          - task: Docker@2
            inputs:
              command: 'buildAndPush'
              repository: $(imageName)
              dockerfile: 'Dockerfile'
              containerRegistry: 'ACR-ServiceConnection'
              tags: |
                $(imageTag)
                latest

  - stage: DeployToAKS
    displayName: 'Deploy to AKS'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: Deploy
        steps:
          - task: KubernetesManifest@0
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'AKS-ServiceConnection'
              namespace: 'default'
              manifests: |
                k8s/deployment.yaml
              containers: |
                $(dockerRegistry)/$(imageName):$(imageTag)
