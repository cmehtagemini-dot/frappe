trigger:
  - develop

variables:
  dockerRegistry: 'devopsaiagent.azurecr.io'
  imageName: 'frappe'

stages:
  - stage: BuildAndPush
    displayName: 'Build and Push'
    jobs:
      - job: BuildAndPush
        displayName: 'Build Docker Image'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: Docker@2
            displayName: 'Build and Push to ACR'
            inputs:
              command: 'buildAndPush'
              repository: '$(imageName)'
              dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              containerRegistry: 'ACR-ServiceConnection'
              tags: |
                $(Build.BuildId)
                latest

  - stage: DeployToAKS
    displayName: 'Deploy to AKS'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: DeployToAKS
        displayName: 'Deploy Kubernetes Manifests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: KubernetesManifest@0
            displayName: 'Deploy to AKS'
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'AKS-ServiceConnection'
              namespace: 'default'
              manifests: |
                $(Build.SourcesDirectory)/k8s/deployment.yaml
